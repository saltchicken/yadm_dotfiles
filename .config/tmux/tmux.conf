bind -n M-n display-popup -E '
bash -i -c "
  read -p \"Session name: \" name
  tmux new-session -d -s \$name
  tmux switch-client -t \$name
"'

bind s display-popup -E "
tmux list-sessions | sed -E 's/:.*$//' | grep -v scratch | awk -v cur=\"$(tmux display-message -p '#S')\" '{ if (\$0 == cur) print \$0 \"  ← current\"; else print }' | fzf --reverse | sed 's/ .*//' | xargs tmux switch-client -t
"

bind k run-shell '
  CURRENT=$(tmux display-message -p "##S" | tr -d "\r\n");
  SESSIONS=$(tmux list-sessions -F "##{session_name}" | grep -vFx "$CURRENT");
  if [ -z "$SESSIONS" ]; then
    tmux display-message "No other sessions to switch to";
  else
    NEXT=$(echo "$SESSIONS" | head -n 1);
    tmux switch-client -t "$NEXT";
    tmux kill-session -t "$CURRENT";
  fi
'

bind -n M-g if-shell -F '#{m:gemini,#{session_name}}' { detach-client } { display-popup -E -w 90% -h 90% -b rounded -T "Gemini" -d "#{pane_current_path}" 'tmux new-session -A -s gemini gemini' }

bind -n M-j display-popup -E -w 85% -h 85% -b rounded -T "AI Chat" -d "#{pane_current_path}" 'source /home/saltchicken/.config/tmux/scripts/.venv/bin/activate && llm_plx'

bind g display-popup -E -w 90% -h 90% -b rounded -T "Lazygit" -d "#{pane_current_path}" "lazygit"


