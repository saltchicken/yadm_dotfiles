##### Basics #####

set-window-option -g mode-keys vi
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g status off

set -sg escape-time 0

##### Splits #####

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"


##### Plugins #####

# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

set-option -g @clipboard 'wl-copy'

##### Keybindings #####

unbind -n M-j
unbind -n M-k
unbind -n M-g

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# set -g @sessionx-bind 's'
# set -g @sessionx-new 'n'

bind -n M-i if-shell -F "#{m:*scratch*,#{session_name}}" {
    detach
} {
    display-popup -b rounded -h 80% -w 80% -d "#{pane_current_path}" -E 'bash -c "TERM=xterm tmux new-session -A -s scratch-$(tmux display-message -p "#S")"'
}

